  facebook_app_events: ^0.27.0
  shared_preferences: ^2.5.2
  crypto: ^3.0.6
  flutter_bcrypt: ^1.0.8


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21


flutter_native_splash:
    color: "#b41f23"
    image: assets/logo/splash.png
    # branding: assets/logo/launcher_icon.png
    color_dark: "#b41f23"
    image_dark: assets/logo/splash.png
    # branding_dark: assets/logo/launcher_icon.png

    android_12:
      image: assets/logo/splash.png
      icon_background_color: "#b41f23"
      image_dark: assets/logo/splash.png
      icon_background_color_dark: "#b41f23"

    web: false

dev_dependencies: 
  flutter_lints: ^6.0.0
  flutter_test: 
    sdk: flutter

flutter: 
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/images/
    - assets/images/checkout_icons/
    - assets/images/product_tags/
    - assets/images/startup/
    - assets/logo/
    - ios/Runner.xcodeproj/project.pbxproj


  fonts:
    - family: Cabin
      fonts:
        - asset: assets/fonts/Cabin-Bold.ttf
        - asset: assets/fonts/Cabin-BoldItalic.ttf
        - asset: assets/fonts/Cabin-Italic.ttf
        - asset: assets/fonts/Cabin-Medium.ttf
        - asset: assets/fonts/Cabin-MediumItalic.ttf
        - asset: assets/fonts/Cabin-Regular.ttf
        - asset: assets/fonts/Cabin-SemiBold.ttf
        - asset: assets/fonts/Cabin-SemiBoldItalic.ttf