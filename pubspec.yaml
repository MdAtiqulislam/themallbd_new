  flutter_facebook_auth: ^7.1.1
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.2.0+1
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  share_plus: ^12.0.0
  #facebook_app_events: ^0.19.4
